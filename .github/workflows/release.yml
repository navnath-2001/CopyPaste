name: Create CopyPast Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:

  # ==========================================
  # BUILD ANDROID APK
  # ==========================================
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CopyPast.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CopyPast-Android
          path: CopyPast.apk


  # ==========================================
  # BUILD WINDOWS EXE
  # ==========================================
  windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: windows
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin pyperclip pyinstaller

      - name: Build CopyPast EXE
        working-directory: windows
        run: |
          python -m PyInstaller --onefile --noconsole --exclude-module PyQt5 --exclude-module PySide6 --name CopyPast sync_clipboard.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: CopyPast-Windows
          path: windows/dist/CopyPast.exe


  # ==========================================
  # CREATE GITHUB RELEASE
  # ==========================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - android
      - windows

    steps:

      # IMPORTANT:
      # This checkout fixes:
      # "fatal: not a git repository"
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: CopyPast-Android
          path: android

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: CopyPast-Windows
          path: windows

      - name: Check downloaded files
        run: |
          echo "Android files:"
          ls -lah android

          echo "Windows files:"
          ls -lah windows

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            android/CopyPast.apk \
            windows/CopyPast.exe \
            --title "CopyPast ${{ github.ref_name }}" \
            --generate-notes